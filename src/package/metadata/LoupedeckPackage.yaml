# ==================================================================================================
# GENERAL SETTINGS
# ==================================================================================================

# Package type. Must be plugin4 for plugins.
type: plugin4

# Name that identifies the plugin. Must match <PluginShortName> in the .csproj.
name: Converter

# Plugin name that is shown to the user.
displayName: File Converter

# Short description of the plugin.
description: Convert any file to PDF, Word, PowerPoint, Excel, Markdown and more — Word→PowerPoint, PDF→Word, Markdown→PowerPoint and back — with a single press, dial or Actions Ring tap. Powered by LibreOffice and Pandoc. Developed by Vignesh Kumar U, a Top 50 project (team Deep Work) at the Logitech Dev Studio Hackathon.

# Name of the plugin library file.
pluginFileName: ConverterPlugin.dll

# Plugin version.
version: 1.0

# Author of the plugin. The author can be a company or an individual developer.
author: Vignesh Kumar U

# Copyright information.
copyright: Copyright © 2026 Vignesh Kumar U. All rights reserved.

# Minimum SDK version supported by the plugin.
minimumLoupedeckVersion: 6.0


# ==================================================================================================
# PLUGIN PROPERTIES
# ==================================================================================================

# Location of plugin files on Windows (relative to the plugin base directory).
pluginFolderWin: bin

# Location of plugin files on macOS (relative to the plugin base directory).
pluginFolderMac: bin

# List of devices the plugin is optimized for.
supportedDevices:
    # Logitech MX Creative Console family (MX Creative Keypad and MX Creative Dialpad).
    # Actions assigned here are also available in the Logi Options+ Actions Ring.
    - LoupedeckExtendedFamily

    # LoupedeckCtFamily covers Loupedeck CT, Live and Live S, and Razer Stream Controllers.
    - LoupedeckCtFamily

# List of plugin capabilities. This is a universal (non-application) plugin, so none are set.
pluginCapabilities:


# ==================================================================================================
# LOUPEDECK MARKETPLACE SETTINGS
# ==================================================================================================

# Name of the license that the plugin is licensed under.
# NOTE: GPL license is not compatible with the Marketplace.
license: MIT

# URL of the plugin license.
licenseUrl: https://opensource.org/licenses/MIT

# URL of the support page where users can send suggestions and report bugs.
supportPageUrl: https://github.com/viki22uied/converter/issues

# URL of the plugin homepage. The URL is shown in the Marketplace.
homePageUrl: https://github.com/viki22uied/converter
